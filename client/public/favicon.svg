<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner glowing border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Book Spine & Body -->
  <g filter="url(#shadow)">
    <!-- Book Back Cover -->
    <rect x="110" y="100" width="292" height="312" rx="28" fill="#312e81" opacity="0.6" />
    
    <!-- Main Book Pages -->
    <rect x="120" y="110" width="272" height="292" rx="24" fill="url(#pageGrad)" />
    
    <!-- Spine binding line -->
    <rect x="120" y="110" width="44" height="292" rx="20" fill="#4338ca" />

    <!-- Spine stitches -->
    <line x1="142" y1="150" x2="142" y2="180" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" />
    <line x1="142" y1="240" x2="142" y2="270" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" />
    <line x1="142" y1="330" x2="142" y2="360" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" />

    <!-- Checkmark / Attendance Verification symbol on the cover -->
    <circle cx="270" cy="225" r="54" fill="#4f46e5" />
    <path d="M246 225 L263 242 L296 206" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Logbook horizontal lines -->
    <rect x="200" y="305" width="140" height="10" rx="5" fill="#cbd5e1" />
    <rect x="200" y="330" width="105" height="10" rx="5" fill="#e2e8f0" />
    <rect x="200" y="355" width="125" height="10" rx="5" fill="#e2e8f0" />
  </g>

  <!-- Glowing Bookmark Ribbon -->
  <path d="M330 110 L330 200 L350 180 L370 200 L370 110 Z" fill="#f43f5e" filter="url(#shadow)" />
</svg>
